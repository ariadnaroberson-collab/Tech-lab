<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Match Pairs — Tech Lab</title>
<style>
  :root{
    --navy:#12233F; --navy-light:#1B355C; --paper:#EDE6D6;
    --amber:#FFB627; --coral:#FF6B5E; --mint:#4ECB8D; --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--navy);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:40px 40px;
    font-family:'Trebuchet MS', sans-serif; color:var(--paper);
    display:flex; flex-direction:column; align-items:center; padding:24px;
  }
  .stamp{position:fixed; bottom:14px; right:18px; font-family:Consolas,'Courier New',monospace;
    font-size:11px; letter-spacing:1px; border:1px solid var(--amber); color:var(--amber);
    padding:4px 10px; opacity:.8;}
  h1{font-size:2.1rem; margin:6px 0 2px;}
  .sub{font-family:Consolas,'Courier New',monospace; color:var(--amber); font-size:.85rem; margin-bottom:14px;}
  .scorebar{font-family:Consolas,'Courier New',monospace; font-size:1rem; margin-bottom:16px;}
  .card{
    background:var(--navy-light); border:2px dashed var(--amber); border-radius:14px;
    padding:26px; max-width:640px; width:100%; box-shadow:0 8px 26px rgba(0,0,0,.35);
  }
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:820px; width:100%;}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);}}
  .tile{
    background:var(--navy-light); border:2px dashed var(--amber); border-radius:10px;
    min-height:100px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:10px; font-size:.95rem; cursor:pointer; font-weight:bold; user-select:none;
  }
  .tile .back{font-size:1.8rem; color:var(--amber);}
  .tile.flipped{background:var(--paper); color:var(--navy); border-style:solid;}
  .tile.matched{background:var(--mint); color:var(--navy); border-style:solid; cursor:default; opacity:.9;}
  .end{display:none; text-align:center; margin-top:20px;}
  .end h2{font-size:2rem;}
  .btn{background:var(--amber); color:var(--navy); border:none; border-radius:8px;
    padding:12px 26px; font-size:1.05rem; font-weight:bold; cursor:pointer; margin-top:14px; margin-right:8px;}
  .btn.outline{background:var(--navy); color:var(--paper); border:1px solid var(--amber);}
  .unitBtn{
    display:block; width:100%; text-align:left; background:var(--paper); color:var(--navy);
    border:none; border-radius:10px; padding:16px 18px; margin-bottom:12px; font-size:1.1rem;
    font-weight:bold; cursor:pointer;
  }
  .unitBtn small{display:block; font-weight:normal; font-family:Consolas,monospace; font-size:.8rem; margin-top:4px; opacity:.75;}
</style>
</head>
<body>
  <h1>🧩 Match Pairs</h1>
  <div class="sub">MATCH-PAIRS.EXE — FLIP TWO CARDS TO FIND A MATCH</div>

  <div class="card" id="pickerCard">
    <p style="font-size:1.2rem; margin-bottom:16px;">Choose a unit to play:</p>
    <div id="unitList"></div>
  </div>

  <div class="scorebar" id="scorebar" style="display:none;">Moves: <span id="moves">0</span> &nbsp;|&nbsp; Matches: <span id="matches">0</span> / <span id="total"></span></div>

  <div class="grid" id="grid" style="display:none;"></div>

  <div class="end" id="endCard">
    <h2>🎉 All Matched!</h2>
    <p id="finalStats"></p>
    <button class="btn" id="restartBtn">Play Again</button>
    <button class="btn outline" id="switchBtn">Choose Different Unit</button>
  </div>

  <div class="stamp">TECH LAB · MATCH PAIRS</div>

<script>
/* =========================================================
   ADD A NEW UNIT: copy one of the blocks inside `units` below
   and give it a new key. The link to this game NEVER changes —
   just re-upload this file with the new unit added and every
   old link/embed keeps working.
   ========================================================= */
const CONFIG = {
  units: {
    "moving-machines": {
      label: "Tech-6 · S03 Moving Machines (Lower Elementary)",
      pairs: [
        {term:"Gear", def:"A wheel with teeth that locks with another to pass on movement"},
        {term:"Lever", def:"A bar that tips to lift something when you push one end"},
        {term:"Wheel & Axle", def:"A round part that spins on a rod to help things roll"},
        {term:"Model", def:"A built version of an idea you can test and improve"},
        {term:"Debug", def:"To find and fix a problem in your build or code"},
        {term:"Sensor", def:"A part that detects something, like light, touch, or motion"}
      ]
    },
    "narrative-worldbuilding": {
      label: "Game Design · E02 Narrative & Worldbuilding (Secondary)",
      pairs: [
        {term:"Linear narrative", def:"A story that unfolds in one fixed order, with no player choice"},
        {term:"Branching narrative", def:"A story where player choices lead to different paths"},
        {term:"Emergent narrative", def:"A story that forms from player actions rather than a fixed script"},
        {term:"Worldbuilding", def:"Creating the setting, culture, and history of a game's world"},
        {term:"Player agency", def:"The sense that a player's own choices actually matter"},
        {term:"Story bible", def:"A reference document that keeps all story details consistent"}
      ]
    },
    "digital-habits-footprint": {
      label: "Tech 9-12 · Digital Habits & Footprint (Secondary)",
      pairs: [
        {term:"Naming Convention", def:"A consistent pattern for naming files so they're easy to find later"},
        {term:"Folder Structure", def:"The way folders are organized and nested to sort files logically"},
        {term:"Cloud Storage", def:"Online storage that backs up files and makes them accessible from any device"},
        {term:"Digital Footprint", def:"The trail of data and activity you leave behind online"},
        {term:"Cyberbullying", def:"Using technology to repeatedly hurt, harass, or intimidate someone"},
        {term:"Digital Citizenship", def:"Acting responsibly and respectfully while using technology online"},
        {term:"Backup", def:"A saved copy of a file kept in a second location in case the original is lost"},
        {term:"Privacy Settings", def:"Controls that decide who can see what you post or share online"},
        {term:"Online Reputation", def:"How someone is seen by others based on their digital footprint"},
        {term:"Consent", def:"Getting someone's permission before posting about or sharing something involving them"},
        {term:"Sync", def:"Automatically updating a file across all devices connected to the same cloud account"}
      ]
    }
  }
};
/* ========================================================= */

let currentUnit=null, cards=[], flipped=[], matchedCount=0, moves=0, lock=false;

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function showPicker(){
  document.getElementById('pickerCard').style.display='block';
  document.getElementById('scorebar').style.display='none';
  document.getElementById('grid').style.display='none';
  document.getElementById('endCard').style.display='none';
  const list = document.getElementById('unitList');
  list.innerHTML='';
  Object.entries(CONFIG.units).forEach(([key, unit])=>{
    const btn = document.createElement('button');
    btn.className='unitBtn';
    btn.innerHTML = `${unit.label}<small>${unit.pairs.length} pairs</small>`;
    btn.onclick = ()=>startUnit(key);
    list.appendChild(btn);
  });
}

function buildDeck(pairs){
  let deck=[];
  pairs.forEach((p,i)=>{
    deck.push({pairId:i, label:p.term, type:'term'});
    deck.push({pairId:i, label:p.def, type:'def'});
  });
  return shuffle(deck);
}

function startUnit(key){
  currentUnit = CONFIG.units[key];
  cards = buildDeck(currentUnit.pairs);
  flipped=[]; matchedCount=0; moves=0; lock=false;
  document.getElementById('moves').textContent=0;
  document.getElementById('matches').textContent=0;
  document.getElementById('total').textContent=currentUnit.pairs.length;
  document.getElementById('pickerCard').style.display='none';
  document.getElementById('scorebar').style.display='block';
  document.getElementById('grid').style.display='grid';
  document.getElementById('endCard').style.display='none';
  render();
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  cards.forEach((c, i)=>{
    const div = document.createElement('div');
    div.className='tile' + (c.state==='flipped'?' flipped':'') + (c.state==='matched'?' matched':'');
    div.innerHTML = c.state ? c.label : '<span class="back">?</span>';
    div.onclick = ()=>flipCard(i);
    grid.appendChild(div);
  });
}

function flipCard(i){
  if(lock) return;
  const c = cards[i];
  if(c.state) return;
  c.state='flipped';
  flipped.push(i);
  render();
  if(flipped.length===2){
    moves++;
    document.getElementById('moves').textContent = moves;
    lock=true;
    const [a,b] = flipped;
    if(cards[a].pairId===cards[b].pairId && cards[a].type!==cards[b].type){
      cards[a].state='matched'; cards[b].state='matched';
      matchedCount++;
      document.getElementById('matches').textContent = matchedCount;
      flipped=[]; lock=false; render();
      if(matchedCount===currentUnit.pairs.length){
        setTimeout(()=>{
          document.getElementById('grid').style.display='none';
          document.getElementById('scorebar').style.display='none';
          document.getElementById('endCard').style.display='block';
          document.getElementById('finalStats').textContent = `Solved in ${moves} moves!`;
        },300);
      }
    } else {
      setTimeout(()=>{
        cards[a].state=null; cards[b].state=null;
        flipped=[]; lock=false; render();
      },800);
    }
  }
}

document.getElementById('restartBtn').onclick = ()=>{
  const key = Object.keys(CONFIG.units).find(k=>CONFIG.units[k]===currentUnit);
  startUnit(key);
};
document.getElementById('switchBtn').onclick = showPicker;

showPicker();
</script>
</body>
</html>
